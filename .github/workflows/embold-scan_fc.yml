# .github/workflows/embold-scan_fc.yml

name: Embold Code Quality Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  embold-scan_fc:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Install Missing Logging Dependencies
      - name: Install Required Logging Libraries
        run: |
          mvn dependency:get -Dartifact=commons-logging:commons-logging:1.2
          mvn dependency:get -Dartifact=log4j:log4j:1.2.17
          mvn dependency:get -Dartifact=org.slf4j:slf4j-api:1.7.30
          mvn dependency:get -Dartifact=org.apache.logging.log4j:log4j-api:2.17.2
          mvn dependency:get -Dartifact=org.apache.logging.log4j:log4j-core:2.17.2

      # Step 4: Build
      - name: Build with Maven and Run Analysis
        run: mvn -B clean verify -DskipTests

      # Step 5: Download & Extract Embold Scanner
      - name: Download and Extract Scanner
        run: |
          curl ${{ vars.EMBOLD_SCANNER_URL }} -o browserstack-codequality-scanner-archive.tar.gz
          tar xvf browserstack-codequality-scanner-archive.tar.gz

      # Step 6: Download Repository Configuration
      - name: Download Repository Configuration
        run: |
          curl --silent --location --request GET "${{ vars.EMBOLD_URL_JAVA }}/api/v1/repositories/ed90e3be6660aecdd71ceb2aa7f8306d/scans/config/download" \
            --header "Authorization: Bearer ${{ secrets.EMBOLD_TOKEN_JAVA }}" \
            -o repository-configuration.json

      # Step 7: Run Embold Scanner
      - name: Run Embold Scanner
        env:
          EMBOLD_TOKEN: ${{ secrets.EMBOLD_TOKEN_JAVA }}
        run: |
          ./browserstack-codequality-scanner/bin/embold-scanner analyse \
            -u ${{ vars.EMBOLD_URL_JAVA }} \
            -t $EMBOLD_TOKEN \
            -r ed90e3be6660aecdd71ceb2aa7f8306d \
            -b . \
            -d ./embold-data \
            -c ./repository-configuration.json \
            -l ./embold-log \
            -sh ./embold-scanner-home \
            -v
