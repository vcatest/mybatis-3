name: Build Maven Project

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven   # ensures dependencies are downloaded correctly

      - name: Clean local Maven repo (fixes missing dependency errors)
        run: rm -rf ~/.m2/repository/org/apache

      - name: Force Maven to download all dependencies
        run: mvn -B dependency:go-offline --fail-never

      - name: Build with Maven
        run: mvn -B clean install
